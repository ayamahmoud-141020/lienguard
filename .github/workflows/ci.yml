name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # No real services in CI: fixtures and fakes only.
      LIENGUARD_AI: fixture
      LIENGUARD_EMAIL: fake
      DEMO_TODAY: "2026-11-20"
      # Prisma needs syntactically valid URLs to generate the client; nothing connects in CI.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test:unit
      - name: E2E on samples (fixtures, no network)
        run: pnpm test:e2e
      - name: Build
        run: pnpm next build
